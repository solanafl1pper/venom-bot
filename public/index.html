<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrapper">
    <!-- Шапка: 2048 слева, SCORE и BEST справа -->
    <header class="header">
      <div class="logo-box">2048</div>
      <div class="scores-box">
        <div class="score-card">
          <div class="score-title">SCORE</div>
          <div class="score-num" id="currentScore">0</div>
        </div>
        <div class="score-card">
          <div class="score-title">BEST</div>
          <div class="score-num" id="bestScore">0</div>
        </div>
      </div>
    </header>

    <!-- Игровое поле 4х4 -->
    <main class="board-container">
      <div class="board" id="board">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="tile-container" id="tileContainer"></div>
      </div>

      <!-- Оверлей Game Over -->
      <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-box">
          <h2 class="overlay-title">Game Over!</h2>
          <p class="overlay-score">Счёт: <span id="overlayScore">0</span></p>
          <button class="btn btn-outline" id="btnOverlayRestart">TRY AGAIN</button>
        </div>
      </div>

      <!-- Модалка MENU -->
      <div class="overlay hidden" id="menuOverlay">
        <div class="overlay-box menu-box">
          <div class="user-info">
            <img class="user-avatar" id="userAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23bbada0'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E" alt="avatar">
            <div class="user-text">
              <div class="user-name" id="userName">Игрок</div>
              <div class="user-status" id="userStatus">Discord Activity</div>
            </div>
          </div>
          <p class="menu-hint">Очки автоматически сохраняются в боте и видны в команде <b>/профиль</b>.</p>
          <button class="btn btn-outline" id="btnCloseMenu">CONTINUE</button>
        </div>
      </div>
    </main>

    <!-- Кнопки под полем: NEW GAME и MENU -->
    <div class="controls-row">
      <button class="btn btn-outline" id="btnNewGame">NEW GAME</button>
      <button class="btn btn-outline" id="btnMenu">MENU</button>
    </div>

    <!-- Подсказка управления -->
    <footer class="footer">
      Arrows / WASD to slide · same numbers merge
    </footer>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
