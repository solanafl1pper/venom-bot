<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048 · Discord Activity</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="user-pill" id="userPill">
        <img class="user-avatar" id="userAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23818cf8'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E" alt="avatar">
        <span class="user-name" id="userName">Игрок</span>
        <span class="user-badge" id="userBadge">АКТИВНОСТЬ</span>
      </div>

      <div class="scores-row">
        <div class="score-card">
          <span class="score-label">СЧЁТ</span>
          <span class="score-value" id="currentScore">0</span>
        </div>
        <div class="score-card best">
          <span class="score-label">РЕКОРД</span>
          <span class="score-value" id="bestScore">0</span>
        </div>
      </div>
    </header>

    <div class="game-toolbar">
      <div class="title-block">
        <h1 class="logo-title">2048</h1>
        <span class="logo-sub">ARCADE EDITION</span>
      </div>
      <button class="btn btn-action" id="btnRestart">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        Заново
      </button>
    </div>

    <main class="board-wrapper">
      <div class="board" id="board">
        <!-- 16 ячеек сетки -->
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <!-- Контейнер для анимированных плиток -->
        <div class="tile-container" id="tileContainer"></div>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-card">
          <h2 class="overlay-title" id="overlayTitle">Игра окончена</h2>
          <p class="overlay-sub" id="overlaySub">Ходов больше нет</p>
          <div class="overlay-score-row">
            <span>Итог: <b id="overlayScore">0</b></span>
          </div>
          <button class="btn btn-primary" id="btnOverlayRestart">Сыграть ещё раз</button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="touch-hint">Свайпай пальцем или жми стрелки на клавиатуре</div>
    </footer>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
