<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>2048 · Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF8EF;
      --text-main: #776e65;
      --text-muted: #8f7a66;
      --card-bg: #bbada0;
      --card-label: #eee4da;
      --board-bg: #bbada0;
      --cell-bg: #cdc1b4;
      --logo-bg: #edc22e;
      --logo-shadow: 0 4px 0 #cc9b1c;
      --btn-bg: #fbf8f3;
      --btn-border: #dcd3c7;
      --btn-shadow: 0 2px 0 #d0c5b7;
      --btn-hover: #ede0c8;
      --overlay-bg: rgba(250, 248, 239, 0.95);
      --modal-bg: #ffffff;
      --modal-border: #eee4da;
      --duel-bg: #f3ede6;
      --duel-border: #d5cbc0;
      --tile-gap: 12px;
    }

    body.dark-theme {
      --bg-color: #1e1f22;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --card-bg: #2b2d31;
      --card-label: #80848e;
      --board-bg: #2b2d31;
      --cell-bg: #383a40;
      --logo-bg: #5865f2;
      --logo-shadow: 0 4px 0 #3c45a5;
      --btn-bg: #313338;
      --btn-border: #3f4147;
      --btn-shadow: 0 2px 0 #232428;
      --btn-hover: #383a40;
      --overlay-bg: rgba(30, 31, 34, 0.95);
      --modal-bg: #2b2d31;
      --modal-border: #383a40;
      --duel-bg: #27292d;
      --duel-border: #383a40;
      --tile-gap: 12px;
    }

    @media (max-width: 420px) {
      :root, body.dark-theme {
        --tile-gap: 8px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .game-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-box {
      background: var(--logo-bg);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 900;
      border-radius: 10px;
      padding: 8px 18px;
      line-height: 1.1;
      letter-spacing: 0.5px;
      box-shadow: var(--logo-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .theme-toggle-btn {
      background: var(--btn-bg);
      border: 2px solid var(--btn-border);
      box-shadow: var(--btn-shadow);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .theme-toggle-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .scores-box {
      display: flex;
      gap: 8px;
    }

    .score-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 6px 14px;
      min-width: 72px;
      text-align: center;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
    }

    .score-title {
      color: var(--card-label);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .score-num {
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
    }

    /* Mode Bar */
    .mode-bar {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-bottom: 10px;
    }

    .mode-btn {
      flex: 1;
      background: var(--btn-bg);
      border: 2px solid var(--btn-border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 8px 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--logo-bg);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* Duel Section */
    .duel-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .duel-section.hidden {
      display: none !important;
    }

    .duel-bar {
      width: 100%;
      background: var(--duel-bg);
      border: 2px solid var(--duel-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .duel-player {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 42%;
    }

    .duel-player.opponent {
      flex-direction: row-reverse;
      text-align: right;
    }

    .duel-avatar-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #5865f2;
      flex-shrink: 0;
      background: #2b2d31;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .duel-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duel-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .duel-name {
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .duel-score {
      font-size: 17px;
      font-weight: 900;
      color: #10b981;
    }

    .opponent .duel-score {
      color: #f59e0b;
    }

    .duel-versus {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .vs-badge {
      background: #ef4444;
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      border-radius: 6px;
      padding: 2px 7px;
      letter-spacing: 1px;
    }

    .duel-status-text {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
    }

    .duel-actions-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-duel-action {
      flex: 1;
      background: var(--btn-bg);
      border: 2px solid var(--btn-border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-duel-action.primary {
      background: #5865f2;
      color: #ffffff;
      border-color: #4752c4;
      box-shadow: 0 2px 0 #3c45a5;
    }

    .btn-duel-action:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* Board Container */
    .board-container {
      width: 100%;
      position: relative;
    }

    .board {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--board-bg);
      border-radius: 12px;
      padding: var(--tile-gap);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--tile-gap);
      position: relative;
      touch-action: none;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    .grid-cell {
      background: var(--cell-bg);
      border-radius: 8px;
      width: 100%;
      height: 100%;
    }

    /* Контейнер для летающих плиток */
    .tile-container {
      position: absolute;
      top: var(--tile-gap);
      left: var(--tile-gap);
      right: var(--tile-gap);
      bottom: var(--tile-gap);
      pointer-events: none;
    }

    /* ========================================================
       ПЛИТКИ 2048: ЖИРНЫЙ МОНТСЕРРАТ, ИДЕАЛЬНЫЙ ЦЕНТР
    ======================================================== */
    .tile {
      position: absolute;
      top: 0;
      left: 0;
      width: calc((100% - (3 * var(--tile-gap))) / 4);
      height: calc((100% - (3 * var(--tile-gap))) / 4);
      border-radius: 8px;
      z-index: 10;
      transition: transform 110ms ease-in-out;
      will-change: transform;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      font-weight: 900 !important;
      line-height: 1 !important;
      box-sizing: border-box;
      overflow: hidden;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      font-weight: 900 !important;
      line-height: 1 !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
      box-sizing: border-box;
      letter-spacing: -0.5px;
    }

    .tile.tile-new .tile-inner {
      animation: tile-appear 140ms ease-out;
    }

    .tile.tile-merged .tile-inner {
      animation: tile-pop 160ms ease-in-out;
    }

    /* Размеры шрифта под разрядность числа */
    .tile-2, .tile-2 .tile-inner,
    .tile-4, .tile-4 .tile-inner,
    .tile-8, .tile-8 .tile-inner {
      font-size: clamp(28px, 9vw, 42px) !important;
    }

    .tile-16, .tile-16 .tile-inner,
    .tile-32, .tile-32 .tile-inner,
    .tile-64, .tile-64 .tile-inner {
      font-size: clamp(24px, 7.5vw, 36px) !important;
    }

    .tile-128, .tile-128 .tile-inner,
    .tile-256, .tile-256 .tile-inner,
    .tile-512, .tile-512 .tile-inner {
      font-size: clamp(19px, 6vw, 30px) !important;
    }

    .tile-1024, .tile-1024 .tile-inner,
    .tile-2048, .tile-2048 .tile-inner {
      font-size: clamp(15px, 4.8vw, 24px) !important;
    }

    .tile-super, .tile-super .tile-inner {
      font-size: clamp(13px, 4vw, 20px) !important;
    }

    /* Цвета плиток (Светлая тема) */
    .tile-2, .tile-2 .tile-inner { background: #eee4da; color: #776e65; }
    .tile-4, .tile-4 .tile-inner { background: #ede0c8; color: #776e65; }
    .tile-8, .tile-8 .tile-inner { background: #f2b179; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.18); }
    .tile-16, .tile-16 .tile-inner { background: #f59563; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.18); }
    .tile-32, .tile-32 .tile-inner { background: #f67c5f; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.18); }
    .tile-64, .tile-64 .tile-inner { background: #f65e3b; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.18); }
    .tile-128, .tile-128 .tile-inner { background: #edcf72; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.22); box-shadow: 0 0 12px rgba(237, 207, 114, 0.45); }
    .tile-256, .tile-256 .tile-inner { background: #edcc61; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.22); box-shadow: 0 0 14px rgba(237, 204, 97, 0.5); }
    .tile-512, .tile-512 .tile-inner { background: #edc850; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.22); box-shadow: 0 0 16px rgba(237, 200, 80, 0.6); }
    .tile-1024, .tile-1024 .tile-inner { background: #edc53f; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.25); box-shadow: 0 0 18px rgba(237, 197, 63, 0.7); }
    .tile-2048, .tile-2048 .tile-inner { background: #edc22e; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.3); box-shadow: 0 0 24px rgba(237, 194, 46, 0.85); }
    .tile-super, .tile-super .tile-inner { background: #10b981; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }

    /* Цвета плиток (Тёмная тема) */
    body.dark-theme .tile-2, body.dark-theme .tile-2 .tile-inner { background: #3b3d44; color: #f2f3f5; }
    body.dark-theme .tile-4, body.dark-theme .tile-4 .tile-inner { background: #464850; color: #f2f3f5; }
    body.dark-theme .tile-8, body.dark-theme .tile-8 .tile-inner { background: #ea7a32; color: #ffffff; }
    body.dark-theme .tile-16, body.dark-theme .tile-16 .tile-inner { background: #e85934; color: #ffffff; }
    body.dark-theme .tile-32, body.dark-theme .tile-32 .tile-inner { background: #e04434; color: #ffffff; }
    body.dark-theme .tile-64, body.dark-theme .tile-64 .tile-inner { background: #d12e2e; color: #ffffff; }
    body.dark-theme .tile-128, body.dark-theme .tile-128 .tile-inner { background: #e5a420; color: #ffffff; box-shadow: 0 0 12px rgba(229, 164, 32, 0.5); }
    body.dark-theme .tile-256, body.dark-theme .tile-256 .tile-inner { background: #d89617; color: #ffffff; box-shadow: 0 0 14px rgba(216, 150, 23, 0.6); }
    body.dark-theme .tile-512, body.dark-theme .tile-512 .tile-inner { background: #cc870f; color: #ffffff; box-shadow: 0 0 16px rgba(204, 135, 15, 0.7); }
    body.dark-theme .tile-1024, body.dark-theme .tile-1024 .tile-inner { background: #bf7808; color: #ffffff; box-shadow: 0 0 18px rgba(191, 120, 8, 0.8); }
    body.dark-theme .tile-2048, body.dark-theme .tile-2048 .tile-inner { background: #5865f2; color: #ffffff; box-shadow: 0 0 24px rgba(88, 101, 242, 0.9); }
    body.dark-theme .tile-super, body.dark-theme .tile-super .tile-inner { background: #23a55a; color: #ffffff; }

    @keyframes tile-appear {
      0% { opacity: 0; transform: scale(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes tile-pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Controls */
    .controls-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      width: 100%;
    }

    .btn {
      flex: 1;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.8px;
      padding: 10px 16px;
      transition: all 0.15s ease;
      outline: none;
      text-align: center;
    }

    .btn-action {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 2px solid var(--btn-border);
      box-shadow: var(--btn-shadow);
    }

    .btn-action:hover {
      background: var(--btn-hover);
    }

    .btn-action:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .footer {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-25px);
      background: rgba(20, 20, 24, 0.94);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 800;
      z-index: 999;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      white-space: nowrap;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay-bg);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
      z-index: 50;
    }

    .overlay.hidden {
      display: none !important;
    }

    .overlay-box {
      background: var(--modal-bg);
      border-radius: 12px;
      padding: 22px 26px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border: 2px solid var(--modal-border);
      max-width: 86%;
    }

    .overlay-title {
      color: var(--text-main);
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .overlay-score {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .overlay-score span {
      color: #10b981;
      font-size: 22px;
      font-weight: 900;
    }

    .menu-box {
      text-align: left;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--modal-border);
    }

    .user-avatar-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #10b981;
      overflow: hidden;
      flex-shrink: 0;
      background: #2b2d31;
    }

    .user-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-name {
      font-size: 16px;
      font-weight: 900;
      color: var(--text-main);
    }

    .user-status {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .menu-hint {
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="game-wrapper">
    <!-- Шапка -->
    <header class="header">
      <div class="header-left">
        <div class="logo-box">2048</div>
        <button class="theme-toggle-btn" id="btnThemeToggle" title="Сменить тему">
          <span id="themeIcon">🌙</span>
        </button>
      </div>

      <div class="scores-box">
        <div class="score-card">
          <div class="score-title">SCORE</div>
          <div class="score-num" id="currentScore">0</div>
        </div>
        <div class="score-card">
          <div class="score-title">BEST</div>
          <div class="score-num" id="bestScore">0</div>
        </div>
      </div>
    </header>

    <!-- Переключатель режима: Соло / Дуэль -->
    <div class="mode-bar">
      <button class="mode-btn active" id="btnModeSolo">🕹️ Соло</button>
      <button class="mode-btn" id="btnModeDuel">⚔️ Дуэль</button>
    </div>

    <!-- Секция дуэли -->
    <div class="duel-section hidden" id="duelSection">
      <div class="duel-bar">
        <div class="duel-player me">
          <div class="duel-avatar-wrap">
            <img id="myDuelAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235865f2'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E" alt="avatar">
          </div>
          <div class="duel-meta">
            <span class="duel-name" id="myDuelName">Ты</span>
            <span class="duel-score" id="myDuelScore">0</span>
          </div>
        </div>

        <div class="duel-versus">
          <span class="vs-badge">VS</span>
          <span class="duel-status-text" id="duelStatusText">Ожидание...</span>
        </div>

        <div class="duel-player opponent">
          <div class="duel-avatar-wrap">
            <img id="oppDuelAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'%3E%3Cpath d='M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h2a3 3 0 0 1 3 3v2h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v1a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-1H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h1v-2a3 3 0 0 1 3-3h2V5.72A2 2 0 0 1 12 2zm-3 8a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1zm6 0a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1z'/%3E%3C/svg%3E" alt="avatar">
          </div>
          <div class="duel-meta">

            <span class="duel-score" id="oppDuelScore">0</span>
          </div>
        </div>
      </div>

      <!-- Кнопки действий дуэли -->
      <div class="duel-actions-row">
        <button class="btn-duel-action primary" id="btnInviteFriend">
          👥 Позвать на дуэль
        </button>
        <button class="btn-duel-action" id="btnToggleBot">
          🤖 Дуэль с ботом
        </button>
      </div>
    </div>

    <!-- Игровое поле 4х4 -->
    <main class="board-container">
      <div class="board" id="board">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <!-- Контейнер для анимированных плиток -->
        <div class="tile-container" id="tileContainer"></div>
      </div>

      <!-- Оверлей Game Over -->
      <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-box">
          <h2 class="overlay-title" id="overlayTitle">Game Over!</h2>
          <p class="overlay-score">Счёт: <span id="overlayScore">0</span></p>
          <button class="btn btn-action" id="btnOverlayRestart">TRY AGAIN</button>
        </div>
      </div>

      <!-- Модалка MENU -->
      <div class="overlay hidden" id="menuOverlay">
        <div class="overlay-box menu-box">
          <div class="user-info">
            <div class="user-avatar-wrap">
              <img id="userAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235865f2'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E" alt="avatar">
            </div>
            <div class="user-text">
              <div class="user-name" id="userName">Игрок</div>
              <div class="user-status" id="userStatus">Discord Activity</div>
            </div>
          </div>
          <p class="menu-hint">Очки сохраняются в боте и видны в <b>/профиль</b>. В режиме <b>Дуэль</b> ты можешь позвать друзей или сразиться с ботом!</p>
          <button class="btn btn-action" id="btnCloseMenu">ПРОДОЛЖИТЬ</button>
        </div>
      </div>
    </main>

    <!-- Кнопки под полем -->
    <div class="controls-row">
      <button class="btn btn-action" id="btnNewGame">НОВАЯ ИГРА</button>
      <button class="btn btn-action" id="btnMenu">МЕНЮ</button>
    </div>

    <!-- Подсказка -->
    <footer class="footer">
      Стрелки / WASD / свайпы пальцем · Одинаковые цифры сливаются
    </footer>
  </div>

  <!-- Встроенный логический модуль без внешних зависимостей -->
  <script type="module">
    import './game.js?v=2048_fix_v4';

</body>
